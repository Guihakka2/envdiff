<svg xmlns="http://www.w3.org/2000/svg" width="760" height="362" viewBox="0 0 760 362" role="img" aria-label="envdiff demo: compares .env files and shows only key names, never values">
<style>text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes k0{0%,2.14%{opacity:0}2.21%,47.14%{opacity:1}47.21%,100%{opacity:0}}.l0{animation:k0 14s infinite}@keyframes k1{0%,10.86%{opacity:0}10.93%,47.14%{opacity:1}47.21%,100%{opacity:0}}.l1{animation:k1 14s infinite}@keyframes k2{0%,12.57%{opacity:0}12.64%,47.14%{opacity:1}47.21%,100%{opacity:0}}.l2{animation:k2 14s infinite}@keyframes k3{0%,13.43%{opacity:0}13.50%,47.14%{opacity:1}47.21%,100%{opacity:0}}.l3{animation:k3 14s infinite}@keyframes k4{0%,14.29%{opacity:0}14.36%,47.14%{opacity:1}47.21%,100%{opacity:0}}.l4{animation:k4 14s infinite}@keyframes k5{0%,16.00%{opacity:0}16.07%,47.14%{opacity:1}47.21%,100%{opacity:0}}.l5{animation:k5 14s infinite}@keyframes k6{0%,16.86%{opacity:0}16.93%,47.14%{opacity:1}47.21%,100%{opacity:0}}.l6{animation:k6 14s infinite}@keyframes k7{0%,18.57%{opacity:0}18.64%,47.14%{opacity:1}47.21%,100%{opacity:0}}.l7{animation:k7 14s infinite}@keyframes k8{0%,52.14%{opacity:0}52.21%,97.14%{opacity:1}97.21%,100%{opacity:0}}.l8{animation:k8 14s infinite}@keyframes k9{0%,60.86%{opacity:0}60.93%,97.14%{opacity:1}97.21%,100%{opacity:0}}.l9{animation:k9 14s infinite}@keyframes k10{0%,62.57%{opacity:0}62.64%,97.14%{opacity:1}97.21%,100%{opacity:0}}.l10{animation:k10 14s infinite}@keyframes k11{0%,63.43%{opacity:0}63.50%,97.14%{opacity:1}97.21%,100%{opacity:0}}.l11{animation:k11 14s infinite}@keyframes k12{0%,65.14%{opacity:0}65.21%,97.14%{opacity:1}97.21%,100%{opacity:0}}.l12{animation:k12 14s infinite}@keyframes k13{0%,66.00%{opacity:0}66.07%,97.14%{opacity:1}97.21%,100%{opacity:0}}.l13{animation:k13 14s infinite}@keyframes k14{0%,66.86%{opacity:0}66.93%,97.14%{opacity:1}97.21%,100%{opacity:0}}.l14{animation:k14 14s infinite}@keyframes k15{0%,68.57%{opacity:0}68.64%,97.14%{opacity:1}97.21%,100%{opacity:0}}.l15{animation:k15 14s infinite}@keyframes k16{0%,70.29%{opacity:0}70.36%,97.14%{opacity:1}97.21%,100%{opacity:0}}.l16{animation:k16 14s infinite}</style>
<rect width="760" height="362" rx="10" fill="#0d1117"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="380" y="22" text-anchor="middle" fill="#8b949e" style="font-size:12px">envdiff</text>
<text class="l0" x="20" y="56" opacity="0"><tspan fill="#a78bfa">$ </tspan><tspan fill="#e6edf3">npx @guihakka2/envdiff</tspan></text><text class="l1" x="20" y="78" opacity="0"><tspan fill="#e6edf3" font-weight="700">envdiff  .env.example  vs  .env</tspan></text><text class="l2" x="20" y="122" opacity="0"><tspan fill="#f87171">Missing in .env:</tspan></text><text class="l3" x="20" y="144" opacity="0"><tspan fill="#e6edf3">  - AWS_ACCESS_KEY_ID</tspan></text><text class="l4" x="20" y="166" opacity="0"><tspan fill="#e6edf3">  - REDIS_URL</tspan></text><text class="l5" x="20" y="210" opacity="0"><tspan fill="#f87171">Possible real secrets in template files:</tspan></text><text class="l6" x="20" y="232" opacity="0"><tspan fill="#e6edf3">  ! .env.example: AWS_ACCESS_KEY_ID (line 4)</tspan></text><text class="l7" x="20" y="276" opacity="0"><tspan fill="#f87171">✗ Not in sync</tspan></text><text class="l8" x="20" y="56" opacity="0"><tspan fill="#a78bfa">$ </tspan><tspan fill="#e6edf3">npx @guihakka2/envdiff .env.staging .env.production</tspan></text><text class="l9" x="20" y="78" opacity="0"><tspan fill="#e6edf3" font-weight="700">envdiff  .env.staging  vs  .env.production</tspan></text><text class="l10" x="20" y="122" opacity="0"><tspan fill="#f87171">Missing in .env.production:</tspan></text><text class="l11" x="20" y="144" opacity="0"><tspan fill="#e6edf3">  - REDIS_URL</tspan></text><text class="l12" x="20" y="188" opacity="0"><tspan fill="#fbbf24">Different values (hidden):</tspan></text><text class="l13" x="20" y="210" opacity="0"><tspan fill="#e6edf3">  ~ API_KEY</tspan></text><text class="l14" x="20" y="232" opacity="0"><tspan fill="#e6edf3">  ~ DATABASE_URL</tspan></text><text class="l15" x="20" y="276" opacity="0"><tspan fill="#f87171">✗ Not in sync</tspan></text><text class="l16" x="20" y="320" opacity="0"><tspan fill="#8b949e"># values are compared, never printed</tspan></text>
</svg>
