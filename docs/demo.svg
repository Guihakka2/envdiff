,42.10%{opacity:0}42.14%,64.76%{opacity:1}64.81%,100%{opacity:0}}.l17{animation:k17 21s infinite}@keyframes k18{0%,42.86%{opacity:0}42.90%,64.76%{opacity:1}64.81%,100%{opacity:0}}.l18{animation:k18 21s infinite}@keyframes k19{0%,43.24%{opacity:0}43.29%,64.76%{opacity:1}64.81%,100%{opacity:0}}.l19{animation:k19 21s infinite}@keyframes k20{0%,44.00%{opacity:0}44.05%,64.76%{opacity:1}64.81%,100%{opacity:0}}.l20{animation:k20 21s infinite}@keyframes k21{0%,44.38%{opacity:0}44.43%,64.76%{opacity:1}64.81%,100%{opacity:0}}.l21{animation:k21 21s infinite}@keyframes k22{0%,45.14%{opacity:0}45.19%,64.76%{opacity:1}64.81%,100%{opacity:0}}.l22{animation:k22 21s infinite}@keyframes k23{0%,68.10%{opacity:0}68.14%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l23{animation:k23 21s infinite}@keyframes k24{0%,72.76%{opacity:0}72.81%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l24{animation:k24 21s infinite}@keyframes k25{0%,73.52%{opacity:0}73.57%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l25{animation:k25 21s infinite}@keyframes k26{0%,73.90%{opacity:0}73.95%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l26{animation:k26 21s infinite}@keyframes k27{0%,74.67%{opacity:0}74.71%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l27{animation:k27 21s infinite}@keyframes k28{0%,75.05%{opacity:0}75.10%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l28{animation:k28 21s infinite}@keyframes k29{0%,75.43%{opacity:0}75.48%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l29{animation:k29 21s infinite}@keyframes k30{0%,76.19%{opacity:0}76.24%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l30{animation:k30 21s infinite}@keyframes k31{0%,76.57%{opacity:0}76.62%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l31{animation:k31 21s infinite}@keyframes k32{0%,77.33%{opacity:0}77.38%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l32{animation:k32 21s infinite}@keyframes k33{0%,77.71%{opacity:0}77.76%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l33{animation:k33 21s infinite}</style>
<rect width="820" height="429" rx="10" fill="#0d1117"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="410" y="22" text-anchor="middle" fill="#8b949e" style="font-size:12px">envdiff</text>
<text class="l0" x="20" y="56" opacity="0"><tspan fill="#a78bfa">$ </tspan><tspan fill="#e6edf3">npx @guihakka2/envdiff</tspan></text><text class="l1" x="20" y="77" opacity="0"><tspan fill="#ffffff" font-weight="700">envdiff  .env.example  vs  .env</tspan></text><text class="l2" x="20" y="119" opacity="0"><tspan fill="#f87171">Missing in .env.example:</tspan></text><text class="l3" x="20" y="140" opacity="0"><tspan fill="#e6edf3">  - DATABSE_URL</tspan><tspan fill="#8b949e">  (did you mean DATABASE_URL?)</tspan></text><text class="l4" x="20" y="182" opacity="0"><tspan fill="#f87171">Missing in .env:</tspan></text><text class="l5" x="20" y="203" opacity="0"><tspan fill="#e6edf3">  - AWS_ACCESS_KEY_ID</tspan></text><text class="l6" x="20" y="224" opacity="0"><tspan fill="#e6edf3">  - DATABASE_URL</tspan><tspan fill="#8b949e">  (did you mean DATABSE_URL?)</tspan></text><text class="l7" x="20" y="245" opacity="0"><tspan fill="#e6edf3">  - REDIS_URL</tspan></text><text class="l8" x="20" y="287" opacity="0"><tspan fill="#f87171">Security problems:</tspan></text><text class="l9" x="20" y="308" opacity="0"><tspan fill="#e6edf3">  ! .env.example: AWS_ACCESS_KEY_ID (line 4) looks like a real secret in a template file</tspan></text><text class="l10" x="20" y="350" opacity="0"><tspan fill="#f87171">✗ Not in sync</tspan></text><text class="l11" x="20" y="56" opacity="0"><tspan fill="#a78bfa">$ </tspan><tspan fill="#e6edf3">npx @guihakka2/envdiff .env.staging .env.production --table</tspan></text><text class="l12" x="20" y="77" opacity="0"><tspan fill="#ffffff" font-weight="700">envdiff  .env.staging  vs  .env.production</tspan></text><text class="l13" x="20" y="119" opacity="0"><tspan fill="#ffffff" font-weight="700">KEY            .env.staging  .env.production</tspan></text><text class="l14" x="20" y="140" opacity="0"><tspan fill="#fbbf24">DATABASE_URL   A             B</tspan></text><text class="l15" x="20" y="161" opacity="0"><tspan fill="#f87171">REDIS_URL      A             ✗</tspan></text><text class="l16" x="20" y="182" opacity="0"><tspan fill="#e6edf3">STRIPE_SECRET  A             A</tspan></text><text class="l17" x="20" y="224" opacity="0"><tspan fill="#8b949e">Same letter = same value. Values are never shown.</tspan></text><text class="l18" x="20" y="266" opacity="0"><tspan fill="#f87171">Missing in .env.production:</tspan></text><text class="l19" x="20" y="287" opacity="0"><tspan fill="#e6edf3">  - REDIS_URL</tspan></text><text class="l20" x="20" y="329" opacity="0"><tspan fill="#fbbf24">Different values (hidden):</tspan></text><text class="l21" x="20" y="350" opacity="0"><tspan fill="#e6edf3">  ~ DATABASE_URL</tspan></text><text class="l22" x="20" y="392" opacity="0"><tspan fill="#f87171">✗ Not in sync</tspan></text><text class="l23" x="20" y="56" opacity="0"><tspan fill="#a78bfa">$ </tspan><tspan fill="#e6edf3">npx @guihakka2/envdiff .env.staging .env.production --fix --html report.html</tspan></text><text class="l24" x="20" y="77" opacity="0"><tspan fill="#ffffff" font-weight="700">envdiff  .env.staging  vs  .env.production</tspan></text><text class="l25" x="20" y="119" opacity="0"><tspan fill="#4ade80">Added to .env.production (empty values):</tspan></text><text class="l26" x="20" y="140" opacity="0"><tspan fill="#e6edf3">  + REDIS_URL</tspan></text><text class="l27" x="20" y="182" opacity="0"><tspan fill="#fbbf24">Different values (hidden):</tspan></text><text class="l28" x="20" y="203" opacity="0"><tspan fill="#e6edf3">  ~ DATABASE_URL</tspan></text><text class="l29" x="20" y="224" opacity="0"><tspan fill="#e6edf3">  ~ REDIS_URL</tspan></text><text class="l30" x="20" y="266" opacity="0"><tspan fill="#67e8f9">Warnings:</tspan></text><text class="l31" x="20" y="287" opacity="0"><tspan fill="#e6edf3">  ! .env.production: empty REDIS_URL (line 3)</tspan></text><text class="l32" x="20" y="329" opacity="0"><tspan fill="#f87171">✗ Not in sync</tspan></text><text class="l33" x="20" y="350" opacity="0"><tspan fill="#e6edf3">envdiff: report written to report.html</tspan></text>
</svg>
