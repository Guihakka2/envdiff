<svg xmlns="http://www.w3.org/2000/svg" width="760" height="362" viewBox="0 0 760 362" role="img" aria-label="envdiff demo: compares .env files and shows only key names, never values">
<style>text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes k0{0%,1.43%{opacity:0}1.48%,31.43%{opacity:1}31.48%,100%{opacity:0}}.l0{animation:k0 21s infinite}@keyframes k1{0%,7.24%{opacity:0}7.29%,31.43%{opacity:1}31.48%,100%{opacity:0}}.l1{animation:k1 21s infinite}@keyframes k2{0%,8.38%{opacity:0}8.43%,31.43%{opacity:1}31.48%,100%{opacity:0}}.l2{animation:k2 21s infinite}@keyframes k3{0%,8.95%{opacity:0}9.00%,31.43%{opacity:1}31.48%,100%{opacity:0}}.l3{animation:k3 21s infinite}@keyframes k4{0%,9.52%{opacity:0}9.57%,31.43%{opacity:1}31.48%,100%{opacity:0}}.l4{animation:k4 21s infinite}@keyframes k5{0%,10.67%{opacity:0}10.71%,31.43%{opacity:1}31.48%,100%{opacity:0}}.l5{animation:k5 21s infinite}@keyframes k6{0%,11.24%{opacity:0}11.29%,31.43%{opacity:1}31.48%,100%{opacity:0}}.l6{animation:k6 21s infinite}@keyframes k7{0%,12.38%{opacity:0}12.43%,31.43%{opacity:1}31.48%,100%{opacity:0}}.l7{animation:k7 21s infinite}@keyframes k8{0%,34.76%{opacity:0}34.81%,64.76%{opacity:1}64.81%,100%{opacity:0}}.l8{animation:k8 21s infinite}@keyframes k9{0%,40.57%{opacity:0}40.62%,64.76%{opacity:1}64.81%,100%{opacity:0}}.l9{animation:k9 21s infinite}@keyframes k10{0%,41.71%{opacity:0}41.76%,64.76%{opacity:1}64.81%,100%{opacity:0}}.l10{animation:k10 21s infinite}@keyframes k11{0%,42.29%{opacity:0}42.33%,64.76%{opacity:1}64.81%,100%{opacity:0}}.l11{animation:k11 21s infinite}@keyframes k12{0%,43.43%{opacity:0}43.48%,64.76%{opacity:1}64.81%,100%{opacity:0}}.l12{animation:k12 21s infinite}@keyframes k13{0%,44.00%{opacity:0}44.05%,64.76%{opacity:1}64.81%,100%{opacity:0}}.l13{animation:k13 21s infinite}@keyframes k14{0%,44.57%{opacity:0}44.62%,64.76%{opacity:1}64.81%,100%{opacity:0}}.l14{animation:k14 21s infinite}@keyframes k15{0%,45.71%{opacity:0}45.76%,64.76%{opacity:1}64.81%,100%{opacity:0}}.l15{animation:k15 21s infinite}@keyframes k16{0%,46.86%{opacity:0}46.90%,64.76%{opacity:1}64.81%,100%{opacity:0}}.l16{animation:k16 21s infinite}@keyframes k17{0%,68.10%{opacity:0}68.14%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l17{animation:k17 21s infinite}@keyframes k18{0%,73.90%{opacity:0}73.95%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l18{animation:k18 21s infinite}@keyframes k19{0%,74.48%{opacity:0}74.52%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l19{animation:k19 21s infinite}@keyframes k20{0%,75.05%{opacity:0}75.10%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l20{animation:k20 21s infinite}@keyframes k21{0%,75.62%{opacity:0}75.67%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l21{animation:k21 21s infinite}@keyframes k22{0%,76.76%{opacity:0}76.81%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l22{animation:k22 21s infinite}@keyframes k23{0%,77.90%{opacity:0}77.95%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l23{animation:k23 21s infinite}@keyframes k24{0%,78.48%{opacity:0}78.52%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l24{animation:k24 21s infinite}@keyframes k25{0%,79.05%{opacity:0}79.10%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l25{animation:k25 21s infinite}@keyframes k26{0%,79.62%{opacity:0}79.67%,98.10%{opacity:1}98.14%,100%{opacity:0}}.l26{animation:k26 21s infinite}</style>
<rect width="760" height="362" rx="10" fill="#0d1117"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="380" y="22" text-anchor="middle" fill="#8b949e" style="font-size:12px">envdiff</text>
<text class="l0" x="20" y="56" opacity="0"><tspan fill="#a78bfa">$ </tspan><tspan fill="#e6edf3">npx @guihakka2/envdiff</tspan></text><text class="l1" x="20" y="78" opacity="0"><tspan fill="#e6edf3" font-weight="700">envdiff  .env.example  vs  .env</tspan></text><text class="l2" x="20" y="122" opacity="0"><tspan fill="#f87171">Missing in .env:</tspan></text><text class="l3" x="20" y="144" opacity="0"><tspan fill="#e6edf3">  - AWS_ACCESS_KEY_ID</tspan></text><text class="l4" x="20" y="166" opacity="0"><tspan fill="#e6edf3">  - REDIS_URL</tspan></text><text class="l5" x="20" y="210" opacity="0"><tspan fill="#f87171">Possible real secrets in template files:</tspan></text><text class="l6" x="20" y="232" opacity="0"><tspan fill="#e6edf3">  ! .env.example: AWS_ACCESS_KEY_ID (line 4)</tspan></text><text class="l7" x="20" y="276" opacity="0"><tspan fill="#f87171">✗ Not in sync</tspan></text><text class="l8" x="20" y="56" opacity="0"><tspan fill="#a78bfa">$ </tspan><tspan fill="#e6edf3">npx @guihakka2/envdiff .env.staging .env.production</tspan></text><text class="l9" x="20" y="78" opacity="0"><tspan fill="#e6edf3" font-weight="700">envdiff  .env.staging  vs  .env.production</tspan></text><text class="l10" x="20" y="122" opacity="0"><tspan fill="#f87171">Missing in .env.production:</tspan></text><text class="l11" x="20" y="144" opacity="0"><tspan fill="#e6edf3">  - REDIS_URL</tspan></text><text class="l12" x="20" y="188" opacity="0"><tspan fill="#fbbf24">Different values (hidden):</tspan></text><text class="l13" x="20" y="210" opacity="0"><tspan fill="#e6edf3">  ~ API_KEY</tspan></text><text class="l14" x="20" y="232" opacity="0"><tspan fill="#e6edf3">  ~ DATABASE_URL</tspan></text><text class="l15" x="20" y="276" opacity="0"><tspan fill="#f87171">✗ Not in sync</tspan></text><text class="l16" x="20" y="320" opacity="0"><tspan fill="#8b949e"># values are compared, never printed</tspan></text><text class="l17" x="20" y="56" opacity="0"><tspan fill="#a78bfa">$ </tspan><tspan fill="#e6edf3">npx @guihakka2/envdiff .env.staging .env.production --table</tspan></text><text class="l18" x="20" y="78" opacity="0"><tspan fill="#e6edf3" font-weight="700">KEY           .env.staging  .env.production</tspan></text><text class="l19" x="20" y="100" opacity="0"><tspan fill="#e6edf3">API_KEY       A             A</tspan></text><text class="l20" x="20" y="122" opacity="0"><tspan fill="#fbbf24">DATABASE_URL  A             B</tspan></text><text class="l21" x="20" y="144" opacity="0"><tspan fill="#f87171">REDIS_URL     A             ✗</tspan></text><text class="l22" x="20" y="188" opacity="0"><tspan fill="#8b949e">Same letter = same value. Values are never shown.</tspan></text><text class="l23" x="20" y="232" opacity="0"><tspan fill="#a78bfa">$ </tspan><tspan fill="#e6edf3">npx @guihakka2/envdiff --fix --html report.html</tspan></text><text class="l24" x="20" y="254" opacity="0"><tspan fill="#4ade80">Added to .env (empty values):</tspan></text><text class="l25" x="20" y="276" opacity="0"><tspan fill="#e6edf3">  + REDIS_URL</tspan></text><text class="l26" x="20" y="298" opacity="0"><tspan fill="#8b949e">envdiff: report written to report.html</tspan></text>
</svg>
