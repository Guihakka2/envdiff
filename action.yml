name: envdiff
description: Compare .env files across environments without ever printing secret values.
author: Guihakka2
branding: { icon: lock, color: green }
inputs:
  files:
    description: "Files to compare, space-separated. Empty = .env.example vs .env (keys only)."
    required: false
    default: ""
  args:
    description: "Extra flags, e.g. --keys-only --ignore APP_URL,DEBUG_* --strict"
    required: false
    default: ""
runs:
  using: composite
  steps:
    # Runs the code from this exact action ref (no npx download). Inputs go through env, never
    # interpolated into the script, so they can't inject shell commands.
    - shell: bash
      env:
        ENVDIFF_FILES: ${{ inputs.files }}
        ENVDIFF_ARGS: ${{ inputs.args }}
        ENVDIFF_BIN: ${{ github.action_path }}/bin/envdiff.js
      run: |
        set -f +e
        out=$(node "$ENVDIFF_BIN" $ENVDIFF_FILES $ENVDIFF_ARGS 2>&1); code=$?
        echo "$out"
        # HTML-escaped inside <pre>: file names from the repo can't break out and inject markdown/links.
        safe=$(printf '%s' "$out" | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/`/\&#96;/g')
        { echo '### envdiff'; echo '<pre>'; printf '%s\n' "$safe"; echo '</pre>'; } >> "$GITHUB_STEP_SUMMARY"
        exit $code
