name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ matrix.node }}" }
      - run: npm test
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: printf 'A=\nB=\n' > .env.example && printf 'A=secret1\nB=secret2\n' > .env
      - name: in sync passes
        uses: ./
      - run: printf 'A=secret1\n' > .env
      - name: drift fails
        id: drift
        uses: ./
        continue-on-error: true
      - name: assert failure and no values in summary
        env: { OUTCOME: "${{ steps.drift.outcome }}" }
        run: test "$OUTCOME" = failure && ! grep -rq secret1 "$(dirname "$GITHUB_STEP_SUMMARY")"
